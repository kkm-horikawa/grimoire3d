<script type="application/json" id="grimoire-initial">{"library":{"locale":"en","shelf":true,"title":"Grimoire3D Documentation","description":"Turn Markdown into a 3D bookshelf. Learn how to write chapters, embed media and diagrams, and publish a static Grimoire3D site.","siteUrl":"https://kkm-horikawa.github.io/grimoire3d/","socialImage":"./content/assets/share.jpg","author":"Grimoire3D","magicMode":true,"books":[{"id":"publishing","title":"Publishing","cover":"blue"},{"id":"start","title":"Getting Started","cover":"red"},{"id":"writing","title":"Writing Books","cover":"green"}]},"book":{"id":"publishing","title":"Publishing","cover":"blue","pages":[{"id":"index","title":"Publishing","markdown":"# Publishing\n\n## Build a static site\n\nRun this from the directory containing `docs/`.\n\n```sh\nnpx grimoire3d build\n```\n\nThe output is `dist/` by default. To choose a different output directory, use `--out-dir site` or set `outDir: site` in `grimoire.yml`. The CLI protects existing files in an unrelated output directory.\n\n","headingIds":{"0":"publishing","14":"build-a-static-site"},"section":{"id":"build-a-static-site","title":"Build a static site"},"links":{"./metadata.md":"#/publishing/metadata"}},{"id":"index","title":"Publishing","markdown":"## Upload the output\n\nPublish the contents of the output directory with a static host such as Cloudflare Pages or GitHub Pages. This documentation uses GitHub Pages. Upload the complete output so chapter URLs, styles, images, and video work together. Chapter URLs have their own HTML files, so direct links work on a host that serves directory indexes.\n\nFor a site under a subpath, such as a GitHub Pages project at `https://example.github.io/handbook/`, include that path in `siteUrl` before you build.\n\n[Configure your site metadata](./metadata.md) before you publish.\n","headingIds":{"0":"upload-the-output"},"section":{"id":"upload-the-output","title":"Upload the output"},"links":{"./metadata.md":"#/publishing/metadata"}},{"id":"metadata","title":"Site settings and SEO","markdown":"# Site settings and SEO\n\nPlace `grimoire.yml` next to `docs/`.\n\n```yaml\ntitle: Engineering Handbook\ndescription: Setup, operations, and release notes for the project.\nsiteUrl: https://docs.example.com/\nauthor: Documentation Team\nsocialImage: assets/share.avif\nlocale: en\nmagicMode: true\n```\n\n","headingIds":{"0":"site-settings-and-seo"},"links":{}},{"id":"metadata","title":"Site settings and SEO","markdown":"## Titles and social cards\n\nThe build produces standalone HTML for every chapter, including the text, navigation, page title, description, and Open Graph metadata. Visitors and crawlers can read the articles without JavaScript.\n\nSet `siteUrl` to get canonical URLs and a sitemap. Set `socialImage` to an absolute HTTP(S) URL or an image path relative to `docs/`. At the domain root the build also emits `robots.txt` pointing to the sitemap.\n\n","headingIds":{"0":"titles-and-social-cards"},"section":{"id":"titles-and-social-cards","title":"Titles and social cards"},"links":{}},{"id":"metadata","title":"Site settings and SEO","markdown":"## Chapter metadata\n\nSupply `title`, `description`, or `socialImage` in a chapter's YAML front matter. A chapter-level image path is relative to that chapter.\n\n```markdown\n---\ntitle: Deployment guide\ndescription: Publish the project to a static web host.\nsocialImage: ./assets/deploy.avif\n---\n# Deployment\n```\n\nShare the URL for a chapter or a specific heading, for example `/read/publishing/metadata/#chapter-metadata`. Existing links that start with `#/` also work.\n","headingIds":{"0":"chapter-metadata"},"section":{"id":"chapter-metadata","title":"Chapter metadata"},"links":{}}]}}</script>
