<script type="application/ld+json">{"@context":"https://schema.org","@type":"CollectionPage","name":"Getting Started","url":"https://kkm-horikawa.github.io/grimoire3d/read/start/","inLanguage":"en","description":"Install the Grimoire3D CLI and open your first Markdown book."}</script>
<script type="application/json" id="grimoire-initial">{"library":{"locale":"en","shelf":true,"title":"Grimoire3D Documentation","description":"Turn Markdown into a 3D bookshelf. Learn how to write chapters, embed media and diagrams, and publish a static Grimoire3D site.","siteUrl":"https://kkm-horikawa.github.io/grimoire3d/","socialImage":"./content/assets/share.jpg","author":"Grimoire3D","magicMode":true,"books":[{"id":"publishing","title":"Publishing","cover":"blue"},{"id":"start","title":"Getting Started","cover":"red"},{"id":"writing","title":"Writing Books","cover":"green"}]},"book":{"id":"start","title":"Getting Started","cover":"red","pages":[{"id":"index","title":"Getting Started","markdown":"# Getting Started\n\nRun `npx grimoire3d serve` from your project directory to open your existing Markdown as books. Grimoire3D looks for `docs/` directly under that directory by default. Existing Markdown works without a scaffold. Use the [configuration guide](../publishing/metadata.md) to customize the library as needed.\n\nStart with [your first book](./first-book.md). Then learn [how to organize a library](../writing/index.md) or [publish it](../publishing/index.md).\n\nIf you are embedding a book in an existing app, see [BookViewer in React](./react.md).\n","headingIds":{"0":"getting-started"},"links":{"../publishing/metadata.md":"#/publishing/metadata","./first-book.md":"#/start/first-book","../writing/index.md":"#/writing/index","../publishing/index.md":"#/publishing/index","./react.md":"#/start/react"}},{"id":"first-book","title":"Your first book","markdown":"# Your first book\n\n## Preview the book\n\nRun `npx grimoire3d serve` from your project directory. Grimoire3D looks for Markdown in the `docs/` folder directly under that directory by default. Existing Markdown works without a scaffold. See the [configuration guide](../publishing/metadata.md) when you want to customize the library.\n\nOpen the URL shown in the terminal. The preview updates when you add, save, or remove a Markdown file. Use `--docs-dir handbook` to read from `handbook/` or `--port 3001` to use port 3001.\n\n","headingIds":{"0":"your-first-book","19":"preview-the-book"},"section":{"id":"preview-the-book","title":"Preview the book"},"links":{"../publishing/metadata.md":"#/publishing/metadata"}},{"id":"first-book","title":"Your first book","markdown":"## Install the CLI\n\nUse a maintained Node.js 22, 24, or 26 release. To pin the CLI for your project, add it as a development dependency.\n\n```sh\nnpm install --save-dev grimoire3d\n```\n\nAfter `npm install -g grimoire3d`, you can run `grimo serve` and `grimo build`.\n\n","headingIds":{"0":"install-the-cli"},"section":{"id":"install-the-cli","title":"Install the CLI"},"links":{"../publishing/metadata.md":"#/publishing/metadata"}},{"id":"first-book","title":"Your first book","markdown":"## Add Markdown\n\nCreate `docs/index.md` in your project.\n\n```markdown\n# Field Notes\n\nThis is my first 3D book.\n```\n\nAdd `docs/01-setup.md` to write another chapter. To create a bookshelf, put each book in its own folder directly under `docs/`. Give each folder an `index.md` with the title of the book.\n\n","headingIds":{"0":"add-markdown"},"section":{"id":"add-markdown","title":"Add Markdown"},"links":{"../publishing/metadata.md":"#/publishing/metadata"}},{"id":"first-book","title":"Your first book","markdown":"## Navigate the library\n\nChoose a cover to open its book. Use the arrows on screen or the Left and Right arrow keys to turn the page. On a phone, swipe left for the next page or right for the previous one.\n\nOpen **Contents** to jump to a chapter or section. Long pages scroll vertically within the paper. In a large library, use **Find a book** or switch from **Shelves** to **Index**.\n\nChoose **Search text** in the library to search across all books, or **Search this book** in the reader to search the current book. Select a result to open the matching section.\n","headingIds":{"0":"navigate-the-library"},"section":{"id":"navigate-the-library","title":"Navigate the library"},"links":{"../publishing/metadata.md":"#/publishing/metadata"}},{"id":"react","title":"Use BookViewer in React","markdown":"# Use BookViewer in React\n\nIn a React 19 app, use `BookViewer` to display a book with React content. Install the same package archive used by [the CLI](./first-book.md#install-the-cli), then import the component and its stylesheet.\n\n```tsx\nimport { BookViewer } from \"grimoire3d/components\";\nimport \"grimoire3d/styles.css\";\n\nexport function Documentation() {\n  return (\n    \u003cBookViewer\n      pages={[\n        {\n          id: \"intro\",\n          title: \"Introduction\",\n          front: \u003ch1>Field Notes\u003c/h1>,\n          back: \u003cp>Welcome to the project.\u003c/p>,\n        },\n      ]}\n    />\n  );\n}\n```\n\nEach item in `pages` represents a physical sheet with a front and a back. Set `initialPage` to the zero-based index of the starting sheet. Use `onPageChange` to receive the index when the reader turns a page.\n","headingIds":{"0":"use-bookviewer-in-react"},"links":{"./first-book.md#install-the-cli":"#/start/first-book?anchor=install-the-cli"}}]}}</script>
