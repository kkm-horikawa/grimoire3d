name: Publish to npm

on:
  push:
    branches:
      - develop
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Update npm for Trusted Publishing
        run: npm install -g npm@12.2.3 && npm --version

      - name: Verify release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Dev version: triggered by push to develop
      - name: Set dev version
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=${GITHUB_SHA::7}
          DEV_VERSION="${BASE_VERSION}-dev.${SHORT_SHA}"
          echo "Publishing dev version: ${DEV_VERSION}"
          npm version "$DEV_VERSION" --no-git-tag-version

      - name: Publish dev version (Trusted Publishing)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: npm publish --access public --tag dev

      # Production version: triggered by release
      - name: Publish production version (Trusted Publishing)
        if: github.event_name == 'release'
        run: npm publish --access public --tag latest
